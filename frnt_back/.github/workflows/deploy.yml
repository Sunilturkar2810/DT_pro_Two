name: Deploy Kesariya (Node backend + Vite frontend) to EC2

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-kesariya
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Prepare SSH values
        shell: bash
        run: |
          echo "EC2_HOST=$(echo '${{ secrets.EC2_HOST }}' | tr -d '\r\n' | xargs)" >> $GITHUB_ENV
          echo "EC2_USER=$(echo '${{ secrets.EC2_USER }}' | tr -d '\r\n' | xargs)" >> $GITHUB_ENV

      - name: Write SSH key from base64
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "echo SSH connected successfully"

      - name: Deploy to EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e

            PROJECT_DIR="/home/ubuntu/kesariyaGroup"
            BACKEND_DIR="$PROJECT_DIR/backend"
            FRONTEND_DIR="$PROJECT_DIR/Frontend"
            NGINX_DIR="/var/www/html"

            echo "===== Load Node / NVM ====="
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi

            if [ -d "$HOME/.nvm/versions/node" ]; then
              LATEST_NODE_BIN=$(find "$HOME/.nvm/versions/node" -type d -path "*/bin" | sort | tail -n 1)
              export PATH="$LATEST_NODE_BIN:$PATH"
            fi

            export PATH="$(npm config get prefix 2>/dev/null)/bin:$PATH"

            echo "Node: $(which node || true)"
            echo "Npm: $(which npm || true)"
            echo "PM2: $(which pm2 || true)"
            node -v || true
            npm -v || true
            pm2 -v || true

            echo "===== Go to project ====="
            cd "$PROJECT_DIR"

            echo "===== Pull latest code ====="
            git fetch origin
            git checkout main || git checkout -b main origin/main
            git reset --hard origin/main

            echo "===== Backend deploy ====="
            if [ -d "$BACKEND_DIR" ]; then
              cd "$BACKEND_DIR"

              echo "Installing backend dependencies..."
              npm ci

              echo "Checking backend entry..."
              ls -l src/index.js

              echo "Starting or restarting PM2 app..."
              if pm2 describe kesariya-backend >/dev/null 2>&1; then
                pm2 restart kesariya-backend --update-env
              else
                pm2 start src/index.js --name "kesariya-backend"
              fi

              pm2 save
              pm2 ls
              pm2 describe kesariya-backend || true
              pm2 logs kesariya-backend --lines 30 --nostream || true

              cd "$PROJECT_DIR"
            else
              echo "Backend directory not found: $BACKEND_DIR"
              exit 1
            fi

            echo "===== Frontend deploy ====="
            if [ -d "$FRONTEND_DIR" ]; then
              cd "$FRONTEND_DIR"

              echo "Installing frontend dependencies..."
              npm ci

              echo "Building frontend..."
              npm run build

              echo "Copying dist to nginx..."
              sudo mkdir -p "$NGINX_DIR"
              sudo rm -rf "$NGINX_DIR"/*
              sudo cp -r dist/* "$NGINX_DIR"/

              echo "Testing nginx config..."
              sudo nginx -t

              echo "Reloading nginx..."
              sudo systemctl reload nginx
              sudo systemctl enable nginx

              cd "$PROJECT_DIR"
            else
              echo "Frontend directory not found: $FRONTEND_DIR"
              exit 1
            fi

            echo "===== Deployment completed successfully ====="
          EOF
